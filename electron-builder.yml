appId: com.twle.aiplughub
productName: AI Plug Hub
directories:
  buildResources: build
  output: dist
asar: true
extraResources:
  - from: build/icon.png
    to: icon.png
files:
  - '!**/.vscode/*'
  - '!src/**/*'
  - '!e2e/**/*'
  - '!electron.vite.config.*'
  - '!{.eslintrc,.prettierrc,vitest.config,playwright.config}*'
  - '!{tsconfig,tsconfig.*}.json'
win:
  target:
    - nsis
    - portable
  signAndEditExecutable: false
portable:
  artifactName: aiplughub-windows-x64-portable.exe
nsis:
  oneClick: false
  createDesktopShortcut: true
  perMachine: false
  artifactName: aiplughub-windows-x64-installer.exe
mac:
  target: dmg
  category: public.app-category.developer-tools
  artifactName: aiplughub-macos-${arch}.dmg
linux:
  target:
    - AppImage
    - deb
  category: Development
  artifactName: aiplughub-linux-x64.${ext}
fileAssociations:
  - ext: aibundle
    name: AI Bundle
    description: AI Plug Hub Bundle file
    mimeType: application/x-aibundle
